# ==========================================
# 1. CONEXÃO COM O POSTGRESQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/smartcity
spring.datasource.username=postgres
spring.datasource.password=6243
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 2. JPA / HIBERNATE
# ==========================================
# Cria e atualiza automaticamente as tabelas com base nas suas @Entity
spring.jpa.hibernate.ddl-auto=update
# Desativa a impressão de comandos SQL no console para não sujar o menu
spring.jpa.show-sql=false

# ==========================================
# 3. LIMPEZA DO CONSOLE (PARA O MENU INTERATIVO)
# ==========================================
# Remove o banner gigante do Spring na inicialização
spring.main.banner-mode=off
# Exibe apenas erros graves no terminal, mantendo o console livre para o Scanner
logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR